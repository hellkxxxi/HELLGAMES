<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The hellgames icon: a horned gamepad glowing in the dark. Rendered to ../../icon.png by `npm run art`. -->
  <defs>
    <radialGradient id="pit" cx="50%" cy="108%" r="85%">
      <stop offset="0" stop-color="#8f1a08"/>
      <stop offset=".42" stop-color="#330a07"/>
      <stop offset="1" stop-color="#0a0606"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="96" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".3" stop-color="#ffa52e"/>
      <stop offset=".68" stop-color="#ff4d1f"/>
      <stop offset="1" stop-color="#cf1616"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <g id="pad">
      <path d="M150 196 L362 196 C398 196 412 226 418 262 C426 306 430 344 424 368 C419 390 398 402 380 392 C360 381 340 350 322 350 L190 350 C172 350 152 381 132 392 C114 402 93 390 88 368 C82 344 86 306 94 262 C100 226 114 196 150 196 Z"/>
      <path d="M118 96 C100 130 96 172 120 210 L220 200 C168 186 128 150 118 96 Z"/>
      <path d="M394 96 C412 130 416 172 392 210 L292 200 C344 186 384 150 394 96 Z"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#pit)"/>
  <use href="#pad" fill="#ff5a1f" opacity=".5" filter="url(#glow)"/>
  <use href="#pad" fill="url(#fire)"/>
  <g fill="#1c0705">
    <rect x="142" y="272" width="76" height="28" rx="5"/>
    <rect x="166" y="248" width="28" height="76" rx="5"/>
    <circle cx="362" cy="268" r="19"/>
    <circle cx="318" cy="306" r="19"/>
